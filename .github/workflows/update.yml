name: Update flake inputs
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake update
      # CI then builds all three toplevels against the PR, which is the human
      # gate that system.autoUpgrade never had.
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "flake: update inputs"
          title: "flake: update inputs"
          body: |
            Automated weekly `nix flake update`.

            Check the CI build before merging -- this is the only thing standing
            between a broken nixpkgs and a `just deploy`.
          branch: flake-update
          delete-branch: true
