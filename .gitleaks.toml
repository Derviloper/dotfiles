# Two kinds of ciphertext here are *meant* to be committed. Without these
# allowlists the hook fires on every kubernetes/ change and gets disabled.
[extend]
useDefault = true

[allowlist]
description = "Ciphertext that is safe to publish by design"
regexes = [
  # SealedSecrets: only the cluster's controller private key decrypts these.
  '''Ag[A-Za-z0-9+/=]{120,}''',
  # sops values, and the age recipients/envelopes that wrap their data keys.
  '''ENC\[AES256_GCM,data:.*\]''',
  '''-----BEGIN AGE ENCRYPTED FILE-----''',
]
paths = [
  # Wholly sops-managed. Listed per host rather than relying on the regexes
  # above, which only cover these by virtue of how sops formats them today.
  '''hosts/server01/secrets/.*''',
  '''hosts/homelab/secrets/.*''',
]
