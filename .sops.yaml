# One policy for the whole repo. Every rule carries &admin beside the host key,
# without which a secret is editable only on its own machine -- and lost with it.
keys:
  - &admin age1lc7ncq7wlwklwcf8grt0x3e3tp73jm5q7fqayg4sfquzxxc83f9qwhjask
  - &homelab age1yz5ghrmekfvl0ssl6f076fzsz5zctgj384923ev6nehehdsarpuq6fcqkt
  - &server01 age1v0m34gqqk36xgzlh8m22n6ulggzakjtgcer0wn6nw7y20tmsgywqfau3q0
  # Add a host key with:  ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
creation_rules:
  # Covers the directory, but only files you run sops against get encrypted --
  # ssh_host_ed25519_key.pub stays plaintext on purpose.
  - path_regex: ^hosts/homelab/secrets/.*$
    key_groups:
      - age:
          - *admin
          - *homelab
  - path_regex: ^hosts/server01/secrets/.*$
    key_groups:
      - age:
          - *admin
          - *server01
