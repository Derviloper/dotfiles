global:
  domain: argocd.derviloper.de
configs:
  cm:
    exec.enabled: true
    # Re-enabled. When authentik was removed, dex.config went with it but this
    # stayed false and secret.createSecret stayed false -- leaving no local
    # admin and no SSO, i.e. no way to log in at all.
    #
    # The rotation this comment used to describe -- log in with
    # argocd-initial-admin-secret, then `argocd account update-password` --
    # cannot work here, and left the login broken for 224 days. argocd-secret
    # is *owned* by the SealedSecret below (ownerReferences, controller: true),
    # so the controller reconciles its data down to exactly the keys it holds.
    # The bcrypt hash argocd-server writes at bootstrap gets stripped on the
    # next pass, leaving no admin.password for it to compare against, so every
    # login fails no matter what you type.
    #
    # The hash therefore has to be sealed in, not written at runtime. To rotate:
    #   argocd account bcrypt --password <new>
    # then seal that as admin.password, with admin.passwordMtime set to now in
    # RFC3339, into the same SealedSecret alongside the other keys. Changing
    # passwordMtime is what invalidates sessions issued under the old password.
    admin.enabled: true
  # policy.csv previously granted to the authentik groups "ArgoCD Admins" and
  # "ArgoCD Viewers", which no longer exist. Restore group rules here when an
  # identity provider is reintroduced.
  params:
    # Safe only because Traefik terminates TLS in front of argocd-server.
    server.insecure: true
  secret:
    createSecret: false
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      creationTimestamp: null
      name: argocd-secret
      namespace: argocd
    spec:
      encryptedData:
        admin.password: 
        admin.passwordMtime: 
        server.secretkey: 
        webhook.github.secret: 
      template:
        metadata:
          creationTimestamp: null
          name: argocd-secret
          namespace: argocd
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-route
      namespace: argocd
    spec:
      routes:
        - kind: Rule
          match: Host(`argocd.derviloper.de`)
          priority: 10
          services:
            - name: argocd-server
              port: 80
