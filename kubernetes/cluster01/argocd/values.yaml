global:
  domain: argocd.derviloper.de
configs:
  cm:
    exec.enabled: true
    # Re-enabled. When authentik was removed, dex.config went with it but this
    # stayed false and secret.createSecret stayed false -- leaving no local
    # admin and no SSO, i.e. no way to log in at all.
    #
    # After the first sync, read the generated password and rotate it:
    #   kubectl -n argocd get secret argocd-initial-admin-secret \
    #     -o jsonpath='{.data.password}' | base64 -d
    #   argocd account update-password
    # Then seal the new bcrypt hash into argocd-secret as admin.password and
    # delete argocd-initial-admin-secret.
    admin.enabled: true
  # policy.csv previously granted to the authentik groups "ArgoCD Admins" and
  # "ArgoCD Viewers", which no longer exist. Restore group rules here when an
  # identity provider is reintroduced.
  params:
    # Safe only because Traefik terminates TLS in front of argocd-server.
    server.insecure: true
  secret:
    createSecret: false
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      creationTimestamp: null
      name: argocd-secret
      namespace: argocd
    spec:
      encryptedData:
        server.secretkey: 
        webhook.github.secret: 
      template:
        metadata:
          creationTimestamp: null
          name: argocd-secret
          namespace: argocd
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-route
      namespace: argocd
    spec:
      routes:
        - kind: Rule
          match: Host(`argocd.derviloper.de`)
          priority: 10
          services:
            - name: argocd-server
              port: 80
