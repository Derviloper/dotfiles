apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk
  namespace: asterisk
  labels:
    app.kubernetes.io/instance: asterisk
    app.kubernetes.io/name: asterisk
data:
  pjsip.conf: |
    [global]
    type=global
    ; Scanners fingerprint the User-Agent to pick an exploit.
    user_agent=PBX

    [transport-udp]
    type=transport
    protocol=udp
    ; hostNetwork, so this binds the node's real public address. No NAT, hence no
    ; external_media_address -- which keeps server01's origin IP out of this repo.
    bind=0.0.0.0:{{ .Values.sip.port }}

    [endpoint-defaults](!)
    type=endpoint
    context=internal
    transport=transport-udp
    disallow=all
    ; All built in; opus would need a codec module the image does not ship.
    allow=alaw,ulaw,g722
    dtmf_mode=rfc4733
    ; Both handsets are behind one router; direct_media would point their RTP at
    ; each other's private addresses.
    direct_media=no
    rtp_symmetric=yes
    force_rport=yes
    rewrite_contact=yes

    [aor-defaults](!)
    type=aor
    max_contacts=1
    remove_existing=yes
    ; Also keeps the home NAT pinhole open between calls.
    qualify_frequency=30

    ; PJSIP keys sections by name *and* type, so a repeated [1001] is the idiom.
    [1001](endpoint-defaults)
    auth=auth1001
    aors=1001
    callerid=Phone A <1001>

    [1001](aor-defaults)

    [1002](endpoint-defaults)
    auth=auth1002
    aors=1002
    callerid=Phone B <1002>

    [1002](aor-defaults)

    ; The two auth sections, from the asterisk-pjsip-auth SealedSecret. No
    ; [anonymous] endpoint, so unauthenticated callers are rejected outright.
    #include "pjsip_auth.conf"
  extensions.conf: |
    [general]
    static=yes
    writeprotect=yes

    ; The only context any endpoint can reach. No pattern match and no trunk, so a
    ; stolen password rings the other handset and nothing else -- toll fraud is
    ; impossible here rather than guarded against.
    [internal]
    exten => 1001,1,Dial(PJSIP/1001,30)
     same  =>     n,Hangup()

    exten => 1002,1,Dial(PJSIP/1002,30)
     same  =>     n,Hangup()

    ; A dials 2 for B, B dials 1 for A. A SIP phone sends the whole dialled string
    ; in one INVITE, so 1 and 1001 match exactly and cannot collide.
    exten => 1,1,Goto(internal,1001,1)
    exten => 2,1,Goto(internal,1002,1)

    ; Self-test without a second person; both generate their audio in-process, so
    ; neither needs sound files in the image.
    exten => 600,1,Answer()
     same  =>     n,Echo()
     same  =>     n,Hangup()

    exten => 601,1,Answer()
     same  =>     n,Milliwatt()
     same  =>     n,Hangup()
  rtp.conf: |
    [general]
    ; Keep in step with allowedUDPPortRanges in hosts/server01/default.nix; a
    ; mismatch looks like one-way audio.
    rtpstart={{ .Values.rtp.start }}
    rtpend={{ .Values.rtp.end }}
    strictrtp=yes
  logger.conf: |
    [general]

    [logfiles]
    ; To stdout, where k8s-monitoring ships it to Loki. `security` carries the
    ; failed-authentication events.
    console => notice,warning,error,security
