apiVersion: apps/v1
kind: Deployment
metadata:
  name: asterisk
  namespace: asterisk
  labels:
    app.kubernetes.io/instance: asterisk
    app.kubernetes.io/name: asterisk
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    # hostNetwork: a second pod cannot bind the SIP port while the first still
    # holds it, so a rolling update would deadlock.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: asterisk
      app.kubernetes.io/name: asterisk
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: asterisk
        app.kubernetes.io/name: asterisk
      annotations:
        # Rolls the deployment when the dialplan or pjsip.conf changes. Not the
        # secret: rotating a password needs a manual `rollout restart`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # RTP needs a contiguous UDP range, which a Service cannot express -- the
      # LoadBalancer pattern minecraft uses would mean 100 enumerated ports. This
      # also puts Asterisk on the node's public address, so there is no NAT on the
      # server side; hosts/server01/default.nix's firewall is the exposure surface.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # A read-only ConfigMap over /etc/asterisk breaks the entrypoint's
        # chown -R and astdb, both of which need it writable. So seed an emptyDir
        # from the image's own configs and overlay ours on top.
        - name: config
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -d /etc/asterisk ]; then cp -a /etc/asterisk/. /config/; fi
              cp -f /overlay/*.conf /config/
              cp -f /overlay-secret/*.conf /config/
              # The copies land root-owned, but asterisk drops to its own user
              # before reading them -- 0640 alone would lock it out.
              chown -R asterisk:asterisk /config
              chmod 0640 /config/*.conf
          # A pod's effective request is the larger of its containers' sum and its
          # largest init container, so without this the init phase is best-effort.
          resources:{{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: overlay
              mountPath: /overlay
            - name: overlay-secret
              mountPath: /overlay-secret
      containers:
        - name: asterisk
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.sip.port }}
              name: sip
              protocol: UDP
          resources:{{ .Values.resources | toYaml | nindent 12 }}
          # No securityContext on purpose: the entrypoint chowns /var/lib/asterisk
          # before dropping to the asterisk user, so runAsNonRoot would break
          # startup rather than harden it. See values.yaml for what does confine it.
          volumeMounts:
            - name: config
              mountPath: /etc/asterisk
          livenessProbe:
            # Asterisk serves no HTTP; the control socket is the only health signal.
            exec:
              command: ["asterisk", "-rx", "core show uptime"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["asterisk", "-rx", "core show uptime"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          emptyDir: {}
        - name: overlay
          configMap:
            name: asterisk
        - name: overlay-secret
          secret:
            secretName: asterisk-pjsip-auth
