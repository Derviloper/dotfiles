image:
  repository: andrius/asterisk
  # Asterisk 22 LTS. Renovate's helm-values manager sees repository+tag, but the
  # _debian-trixie suffix is not semver, so expect to bump this by hand.
  tag: 22.10.1_debian-trixie
sip:
  # Not 5060, which is scanned around the clock -- this drops the REGISTER and
  # OPTIONS flood to near zero. Being honest about it: this repo is public, so
  # the port is public too. It defeats untargeted scanning, not someone reading
  # this file. The controls that actually matter are the trunkless dialplan in
  # templates/configmap.yaml and 32-character random passwords.
  #
  # Changing this means changing allowedUDPPorts in hosts/server01/default.nix
  # and the SIP Server field on both phones.
  port: 5160
rtp:
  # 100 ports is ~25 concurrent call legs, far more than two handsets can use.
  # Must match allowedUDPPortRanges in hosts/server01/default.nix.
  start: 10000
  end: 10099
# Deliberately absent, so that removing them later is a decision rather than an
# oversight:
#
# - TLS/SRTP. Signalling and audio cross the public internet in the clear.
#   Encrypting them needs a real certificate for Asterisk, i.e. cert-manager as
#   a new cluster app with a Cloudflare DNS-01 issuer reusing the token in
#   traefik/values.yaml, or scraping Traefik's acme.json. The Asterisk side is
#   then a transport-tls section plus media_encryption=sdes on the endpoints.
# - Persistence. No PVC, so a pod restart drops the registrations; the phones
#   re-register within their 2 minute expiry. Nothing here is worth keeping
#   across a restart -- no voicemail, no CDR.
# - fail2ban. The security log lives inside the pod, and with no trunk the worst
#   a brute force achieves is ringing the other handset.
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: asterisk-pjsip-auth
      namespace: asterisk
    spec:
      encryptedData:
        pjsip_auth.conf: 
      template:
        metadata:
          name: asterisk-pjsip-auth
          namespace: asterisk
