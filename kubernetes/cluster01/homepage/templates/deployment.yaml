apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: homepage
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homepage
        app.kubernetes.io/name: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/derviloper/homepage:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:{{ .Values.resources | toYaml | nindent 12 }}
          # Binds 3000, so it needs no capabilities. readOnlyRootFilesystem is off
          # because the server writes a render cache under the app directory, and an
          # emptyDir for it is more moving parts than a static site is worth.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
