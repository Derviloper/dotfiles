image:
  tag: 1.0.0
# Memory limit, CPU request only -- see kubernetes/cluster01/asterisk/values.yaml
# for why that asymmetry is the rule here.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: noop
      namespace: homepage
    spec:
      ports:
        - port: 9999
          targetPort: 9999
      clusterIP: None
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: homepage-redirect-middleware
      namespace: homepage
    spec:
      redirectRegex:
        regex: "^(.*)"
        replacement: "https://derviloper.de"
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: homepage-route
      namespace: homepage
    spec:
      routes:
        - kind: Rule
          match: Host(`derviloper.de`)
          priority: 10
          services:
            - name: homepage
              port: 80
        - kind: Rule
          match: PathPrefix(`/`)
          priority: 1
          middlewares:
            - name: homepage-redirect-middleware
          services:
            - name: noop
              port: 9999
