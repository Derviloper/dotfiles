# Both removed when authentik was dropped left this unsafe:
#
# 1. The kubernetes.derviloper.de IngressRoute lost its forwardAuth middleware,
#    leaving a public login page in front of a cluster-admin dashboard. Use:
#      kubectl -n kubernetes-dashboard port-forward svc/kubernetes-dashboard-kong-proxy 8443:443
# 2. The dashboard-admin-token Secret was a never-expiring cluster-admin bearer
#    token, unrevokable without deleting the ServiceAccount. Mint one per use:
#      kubectl -n kubernetes-dashboard create token dashboard-admin --duration=1h
#
# The ServiceAccount and its binding stay, so minting still works.
extras:
  manifests:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: dashboard-admin
        namespace: kubernetes-dashboard
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: dashboard-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: dashboard-admin
          namespace: kubernetes-dashboard
kong:
  proxy:
    http:
      enabled: true
    tls:
      enabled: false

# The project was archived in January 2026 and its chart repo moved to
# kubernetes-retired.github.io/dashboard. The pin still resolves, but this is an
# unmaintained component holding a cluster-admin binding -- worth replacing with
# k9s or Headlamp, or dropping.
