apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    # Two pods overlapping during a rolling update would both fire every
    # schedule trigger.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/name: n8n
    spec:
      # The `n8n` Service would otherwise inject N8N_PORT=tcp://10.43.x.x:80,
      # which n8n reads as its own listen port and refuses to start on.
      enableServiceLinks: false
      # n8n never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
              protocol: TCP
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgresql-cluster-rw.postgresql.svc.cluster.local
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              value: n8n
            # Secrets go in as *_FILE rather than secretKeyRef so they never sit in
            # the process environment, which expressions and the Code node can read.
            - name: DB_POSTGRESDB_PASSWORD_FILE
              value: /etc/n8n/secrets/db-password
            - name: N8N_ENCRYPTION_KEY_FILE
              value: /etc/n8n/secrets/encryption-key
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "true"
            # A fresh instance hands the owner account to whoever opens it first.
            # This creates it at startup instead, before the public route serves
            # anything, and re-applies it on every boot -- so the password can only
            # be changed by resealing, not from the UI.
            - name: N8N_INSTANCE_OWNER_MANAGED_BY_ENV
              value: "true"
            - name: N8N_INSTANCE_OWNER_EMAIL_FILE
              value: /etc/n8n/secrets/owner-email
            - name: N8N_INSTANCE_OWNER_PASSWORD_HASH_FILE
              value: /etc/n8n/secrets/owner-password-hash
            - name: N8N_HOST
              value: {{ .Values.host }}
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_EDITOR_BASE_URL
              value: https://{{ .Values.host }}/
            - name: N8N_WEBHOOK_URL
              value: https://{{ .Values.host }}/
            # Cloudflare, then Traefik. With 1 the client is always a Cloudflare
            # edge address, and the login rate limiter buckets everyone together.
            - name: N8N_PROXY_HOPS
              value: "2"
            # Blocks workflow requests to private ranges, which covers the pod and
            # service CIDRs -- Loki and Prometheus answer anyone in-cluster.
            - name: N8N_SSRF_PROTECTION_ENABLED
              value: "true"
            - name: GENERIC_TIMEZONE
              value: {{ .Values.timezone }}
            - name: NODE_OPTIONS
              value: --max-old-space-size={{ .Values.heap }}
            # The broker stays on its default 127.0.0.1:5679: the sidecar shares
            # this pod's network namespace, and nothing outside the pod needs it.
            - name: N8N_RUNNERS_MODE
              value: external
            - name: N8N_RUNNERS_AUTH_TOKEN_FILE
              value: /etc/n8n/secrets/runners-auth-token
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "{{ .Values.runners.taskTimeout }}"
            # Pinned at n8n's announced future defaults, so an upgrade that flips
            # them changes nothing. Unverified community packages are arbitrary npm
            # code; the Compression node caps guard against zip bombs.
            - name: N8N_UNVERIFIED_PACKAGES_ENABLED
              value: "false"
            - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
              value: "268435456"
            - name: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
              value: "1000"
          resources:{{ .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: secrets
              mountPath: /etc/n8n/secrets
              readOnly: true
          # Readiness only passes once the database is connected and migrated, and
          # the first boot migrates an empty schema -- hence the long startup window.
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 10
          # /healthz ignores the database, so a Postgres restart does not also
          # restart n8n; it reconnects on its own.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
        # Follows n8n's task runner hardening guide: distroless, its nonroot
        # uid, read-only root with only /tmp writable.
        - name: runners
          image: {{ .Values.runners.repository }}:{{ .Values.image.tag }}-distroless
          imagePullPolicy: IfNotPresent
          env:
            - name: N8N_RUNNERS_AUTH_TOKEN_FILE
              value: /etc/n8n/runners/auth-token
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "{{ .Values.runners.taskTimeout }}"
            - name: GENERIC_TIMEZONE
              value: {{ .Values.timezone }}
            # Reaches only the JavaScript runner; the launcher is Go.
            - name: NODE_OPTIONS
              value: --max-old-space-size={{ .Values.runners.heap }}
          resources:{{ .Values.runners.resources | toYaml | nindent 12 }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runners-token
              mountPath: /etc/n8n/runners
              readOnly: true
            - name: runners-tmp
              mountPath: /tmp
          # The launcher's own health server; it answers while the launcher is up,
          # whether or not a runner is currently running.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5680
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n
        - name: secrets
          secret:
            secretName: n8n
            defaultMode: 0440
        # Only the token -- mounting the whole secret here would hand user code
        # the database password and encryption key the sidecar exists to keep
        # from it. Readable through fsGroup, which also applies to this container.
        - name: runners-token
          secret:
            secretName: n8n
            defaultMode: 0440
            items:
              - key: runners-auth-token
                path: auth-token
        - name: runners-tmp
          emptyDir:
            sizeLimit: 256Mi
