image:
  repository: n8nio/n8n
  # n8n tags its beta line with plain semver too; renovate.json routes this
  # through GitHub releases, where betas are flagged, so only stable bumps land.
  # The runners sidecar reuses this tag: n8n requires both images at the same
  # version, and one tag means Renovate cannot bump them apart.
  tag: 2.39.10
host: n8n.derviloper.de
# Schedule triggers fire in this zone. server01 itself runs UTC.
timezone: Europe/Berlin
# Memory limit, CPU request only -- asterisk/values.yaml explains why. The V8
# heap (MiB) leaves ~250Mi of the limit for native memory; raise both together.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi
heap: 768
persistence:
  size: 1Gi
# Sidecar that runs Code node JavaScript and Python, so user code never shares a
# process -- or a filesystem -- with the database password and encryption key.
# The launcher starts a runner per language on demand and stops it after 15s
# idle, so most of the time this is just the launcher.
runners:
  repository: n8nio/runners
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 512Mi
  # JavaScript runner heap (MiB). Python has no equivalent and shares the rest.
  heap: 256
  # Seconds a Code node may run. 60 is n8n's announced future default (today's
  # is 300) and already the launcher's own, so pinning it now means an upgrade
  # changes nothing.
  taskTimeout: 60
# Plaintext for the first four keys is in local/server01/n8n-secrets.txt on the
# machine that sealed them.
#
# - db-password: the same value as postgresql-n8n-secret in
#   postgresql/values.yaml. Change both together.
# - encryption-key: encrypts every credential stored in the database. Never
#   reseal a new value -- existing credentials become undecryptable. n8n has its
#   own rotation procedure (N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION).
# - owner-email, owner-password-hash: applied to the owner account at every
#   boot. To change the password, replace just that key and restart:
#     mkpasswd -m bcrypt -R 12 | tr -d '\n' | kubeseal --raw --from-file=/dev/stdin \
#       --cert local/server01/sealed-secrets-certificate.pem --namespace n8n --name n8n
#     kubectl -n n8n rollout restart deploy/n8n
# - runners-auth-token: shared by n8n and the runners sidecar, and by nothing
#   else, so no copy is kept. Rotate by sealing any fresh random value the same
#   way.
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: n8n
      namespace: n8n
    spec:
      encryptedData:
        db-password: 
        encryption-key: 
        owner-email: 
        owner-password-hash: 
        runners-auth-token: 
      template:
        metadata:
          name: n8n
          namespace: n8n
