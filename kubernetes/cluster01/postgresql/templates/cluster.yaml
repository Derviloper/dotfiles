apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-cluster
  namespace: {{ .Release.Namespace }}
spec:
  {{- .Values.cluster | toYaml | nindent 2 }}
  {{- /* `with` skips the block entirely when there are no databases. Emitting
         `managed.roles:` with an empty range renders `roles: null`, which the
         CNPG CRD rejects: "must be of type array". */}}
  {{- with .Values.databases }}
  managed:
    roles:
      {{- range . }}
      - name: {{ .name }}
        ensure: present
        passwordSecret:
          name: {{ $.Release.Name }}-{{ .name }}-secret
        connectionLimit: -1
        inherit: true
        login: true
      {{- end }}
  {{- end }}
