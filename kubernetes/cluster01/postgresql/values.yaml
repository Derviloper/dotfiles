cluster:
  instances: 1
  storage:
    size: 1Gi
  monitoring:
    enablePodMonitor: true
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-cluster-superuser
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      creationTimestamp: null
      name: postgresql-cluster-superuser
      namespace: postgresql
    spec:
      encryptedData:
        password: 
        username: 
      template:
        metadata:
          creationTimestamp: null
          name: postgresql-cluster-superuser
          namespace: postgresql
# The `authentik` database and role were removed. Authentik itself was dropped
# in Jan 2026, but this entry kept provisioning a role whose sealed password had
# already been committed in plaintext elsewhere in the old history.
#
# Drop the leftover database and role on the cluster once (CNPG will not do it
# for you -- the declarative databases list only ever creates):
#   kubectl -n postgresql exec -it postgresql-cluster-1 -- \
#     psql -c 'DROP DATABASE IF EXISTS authentik' -c 'DROP ROLE IF EXISTS authentik'
databases: []
