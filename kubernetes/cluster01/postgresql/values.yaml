cluster:
  instances: 1
  storage:
    size: 1Gi
  # Memory limit, CPU request only -- asterisk/values.yaml explains why. CNPG
  # sizes shared_buffers from the memory *limit*, so lowering it shrinks the cache
  # rather than risking an OOM kill; raise it if queries start hitting disk.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-cluster-superuser
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      creationTimestamp: null
      name: postgresql-cluster-superuser
      namespace: postgresql
    spec:
      encryptedData:
        password: 
        username: 
      template:
        metadata:
          creationTimestamp: null
          name: postgresql-cluster-superuser
          namespace: postgresql
# The `authentik` database and role were removed: authentik was dropped in Jan
# 2026, but this kept provisioning a role whose password was already in the old
# history in plaintext. CNPG only ever creates from the declarative list, so drop
# the leftovers on the cluster once:
#   kubectl -n postgresql exec -it postgresql-cluster-1 -- \
#     psql -c 'DROP DATABASE IF EXISTS authentik' -c 'DROP ROLE IF EXISTS authentik'
databases:
  # Sealed as postgresql-<name>-secret in this namespace -- the name
  # templates/sealedsecret.yaml renders, and a value sealed under any other will
  # not decrypt. The password is sealed again, as db-password, in n8n/values.yaml.
  - name: n8n
    username: 
    password: 
