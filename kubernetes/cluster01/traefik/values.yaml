# The traefik.derviloper.de IngressRoute to api@internal was removed. It lost
# its oauth2-proxy forwardAuth middleware when authentik was dropped, leaving
# /api/rawdata -- the full router, service and middleware topology -- publicly
# readable. Reach the dashboard over a port-forward instead:
#   kubectl -n traefik port-forward deploy/traefik 9000:9000
#   open http://127.0.0.1:9000/dashboard/
# Do not re-add a public route without an authentication middleware in front.
ports:
  web:
    port: 80
    nodePort: 30000
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    asDefault: true
    port: 443
    nodePort: 30001
    tls:
      certResolver: letsencrypt
      domains:
        - main: derviloper.de
          sans:
            - "*.derviloper.de"
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      creationTimestamp: null
      name: cloudflare-api-secret
      namespace: traefik
    spec:
      encryptedData:
        api-token: 
      template:
        metadata:
          creationTimestamp: null
          name: cloudflare-api-secret
          namespace: traefik
providers:
  kubernetesCRD:
    allowCrossNamespace: true
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultmode: keep
certificatesResolvers:
  letsencrypt:
    acme:
      email: "acme@derviloper.de"
      storage: "/data/acme.json"
      dnschallenge:
        provider: "cloudflare"
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-secret
        key: api-token
persistence:
  enabled: true
service:
  spec:
    externalTrafficPolicy: Local
